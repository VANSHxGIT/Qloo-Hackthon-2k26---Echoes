[project]
name = "echoes"
version = "0.1.0"
description = "Echoes - Cultural Reminiscence Companion for Memory Loss (Qloo Hackathon)"
authors = [
    { name = "Vansh Rawat", email = "vanshrawat090@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "black>=23.12.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["echoes"]
package-data = {"echoes" = ["*.html", "*.py", "*.json", "*.csv", "*.txt", "*.md", "*.png"]}
include-package-data = true

[tool.setuptools.exclude-package-data]
"echoes" = ["*.pyc", "__pycache__/*"]

[tool.ruff]
line-length = 120
select = [
    "E",
    "F",
    "W",
    "PL",
    "PERF",
    "S",
]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
]
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
extend-exclude = '(\.venv/|node_modules/|__pycache__/|build/|dist/)'

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "6.0"
testpaths = [
    "tests",
]
markers = [
    "integration: marks integration tests",
    "performance: marks performance tests",
]

[tool.vercel]
entrypoint = "main.py"

[tool.fastapi]
entrypoint = "main:app"
