[project]
name = "echoes"
version = "0.1.0"
description = "Echoes - AI Content Moderation Platform"
authors = [
    { name = "Mohamed Zayan", email = "[EMAIL_ADDRESS]" },
]
readme = "README.md"
requires-python = ">=3.13"
license = {
    file = "LICENSE"
}
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.9.1",
    "wordcloud>=1.9.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.2",
    "email-validator>=2.1.0.post1",
    "python-multipart>=0.0.9",
    "openai>=1.14.2",
    "pyjwt>=2.8.0",
    "boto3>=1.34.13",
    "python-jose[cryptography]>=3.3.0",
    "phonenumbers>=8.13.37",
    "beautifulsoup4>=4.12.2",
    "selenium>=4.16.2",
    "webdriver-manager>=4.0.1",
    "psutil>=5.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.2.0",
    "black>=23.12.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["echoes"]
package-data = {"echoes" = ["*.html", "*.py", "*.json", "*.csv", "*.txt", "*.md", "*.png"]}
include-package-data = true

[tool.setuptools.exclude-package-data]"echoes" = ["*.pyc", "__pycache__/*"]

[tool.ruff]
line-length = 120
select = [
    "E",
    "F",
    "W",
    "PL",
    "PERF",
    "S",
]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
]
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
]

[tool.black]
line-length = 120
target-version = ['py313']
extend-exclude = "(\.venv/|node_modules/|__pycache__/|build/|dist/)"

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "6.0"
testpaths = [
    "tests",
]
markers = [
    "integration: marks integration tests",
    "performance: marks performance tests",
]

[tool.vercel]
entrypoint = "main.py"

[tool.fastapi]
entrypoint = "main:app"
